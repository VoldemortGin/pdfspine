# cargo-deny configuration — license + advisory gate (PRD §6.3 / §11.3).
#
# Thesis of the project is license cleanliness, so the shipped graph must be
# free of copyleft. This config denies GPL/AGPL/LGPL/MPL/SSPL and allows only an
# explicit permissive allowlist. Dev-only tooling (hypothesis = MPL) is a Python
# dependency and never enters the cargo graph, so it is not a concern here.

[graph]
all-features = true

[licenses]
# Fail on any license not in this allowlist (no implicit acceptance).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "ISC",
    "CC0-1.0",
    "Unlicense",
]
# Copyleft licenses are denied implicitly by being absent from `allow`. The
# project gate (PRD §11.2) is: zero GPL/AGPL/LGPL/SSPL AND zero MPL in the
# shipped graph.
confidence-threshold = 0.93

# Allow a couple of common dual-licensed crates whose SPDX expression resolves
# cleanly against the allowlist; explicit exceptions go here as the graph grows.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
# Use the RustSec advisory DB; CI fails on known vulnerabilities.
yanked = "deny"
# These are unmaintained notices, not memory-safety/security vulnerabilities:
# - RUSTSEC-2024-0436: transitive `paste` proc macro.
# - RUSTSEC-2026-0192: `ttf-parser`; no safe upgrade exists and replacing it
#   requires a deliberate font-engine migration to skrifa.
# - RUSTSEC-2026-0009: `time` 0.3.41 stack-exhaustion DoS. `time` is only a
#   build-dependency of `tract-linalg` (liquid templates in its build script);
#   it never enters the runtime artifact. tract-linalg 0.21.x pins
#   `time < 0.3.42`, so there is no upgrade path until ocrspine moves to
#   tract 0.22+ — remove this entry then.
# Keep the exceptions precise; every actual vulnerability remains denied.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192", "RUSTSEC-2026-0009"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# OCR is pinned to an audited immutable revision until ocrspine publishes the
# matching crate release. `unknown-git = deny` still rejects every other source.
allow-git = ["https://github.com/VoldemortGin/ocrspine"]
