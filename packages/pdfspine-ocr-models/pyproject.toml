[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pdfspine-ocr-models"
# DEPRECATED/ARCHIVED: retained only for the legacy runtime fallback. Current
# releases depend on the shared `ocrspine-models` distribution and must not build
# or publish this project.
# Archived pure-data companion for pre-shared-model releases. Current pdfspine
# releases depend on `ocrspine-models`; this project is not part of release.yml.
# The runtime still recognizes `pdfspine_ocr_models.models_dir()` as a legacy
# fallback for environments where this package is already installed.
version = "0.0.0"
description = "Deprecated legacy PP-OCRv5 model companion for pdfspine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "pdfspine contributors" }]
keywords = ["pdf", "ocr", "paddleocr", "pp-ocr", "onnx", "pdfspine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/VoldemortGin/pdfspine"
Repository = "https://github.com/VoldemortGin/pdfspine"
Issues = "https://github.com/VoldemortGin/pdfspine/issues"

# The 3 ONNX models are NOT a second copy in git: a custom build hook
# (hatch_build.py) force-includes them from the git-tracked wheel-bundled copy at
# `python/pdfspine/_models/` into both the sdist and the wheel at build time.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

# The Python source of the import package (the .py shim + carried NOTICE/PROVENANCE);
# the ONNX are added by the hook, not tracked here.
[tool.hatch.build.targets.wheel]
packages = ["pdfspine_ocr_models"]

[tool.hatch.build.targets.sdist]
include = ["pdfspine_ocr_models", "hatch_build.py", "README.md"]
