[package]
name = "pdf-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# cargo-fuzz target crate. Excluded from the main workspace (see root
# Cargo.toml): it requires the nightly toolchain and `libfuzzer-sys`. Drive it
# with `cargo +nightly fuzz run <target>`; `.github/workflows/fuzz.yml` runs
# every target daily (PRD §9.6).
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdf-core = { path = "../crates/pdf-core" }
pdf-text = { path = "../crates/pdf-text" }
pdf-fonts = { path = "../crates/pdf-fonts" }

[[bin]]
name = "fuzz_geom"
path = "fuzz_targets/fuzz_geom.rs"
test = false
doc = false
bench = false

# M1d: never-panic / never-hang / never-OOM contract (PRD §9.6).
[[bin]]
name = "fuzz_open"
path = "fuzz_targets/fuzz_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_repair"
path = "fuzz_targets/fuzz_repair.rs"
test = false
doc = false
bench = false

# Content stream → tokenize → interpret → TextPage → table detection.
[[bin]]
name = "fuzz_content"
path = "fuzz_targets/fuzz_content.rs"
test = false
doc = false
bench = false

# Every stream decoder, predictor and short filter chains.
[[bin]]
name = "fuzz_filters"
path = "fuzz_targets/fuzz_filters.rs"
test = false
doc = false
bench = false

# Embedded CMap / ToUnicode programs.
[[bin]]
name = "fuzz_cmap"
path = "fuzz_targets/fuzz_cmap.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
